*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;overflow:hidden}
.intro{position:fixed;inset:0;background:#000;overflow:hidden;touch-action:none;cursor:grab;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none}
.intro:active{cursor:grabbing}
.fog{position:absolute;inset:0;background:radial-gradient(55% 38% at 50% 46%,rgba(255,255,255,.09),transparent 70%),radial-gradient(120% 90% at 50% 50%,transparent 55%,#000 100%);}
.stage{position:relative;width:min(58vw,250px);aspect-ratio:1;perspective:850px}
.glow{position:absolute;inset:-45%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 58%);opacity:.5;animation:glw 5s ease-in-out infinite alternate;pointer-events:none}
@keyframes glw{0%{opacity:.25}100%{opacity:.8}}

.ly{position:absolute;inset:0;background:var(--logo) center/contain no-repeat;filter:brightness(var(--b,1));transform:translateZ(var(--z));pointer-events:none}
.ly.hl{filter:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%) 160% 0/260% 100% no-repeat;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;animation:shn 4.2s 1.5s ease-in-out infinite}

<div class="intro" id="it" role="img" aria-label="Круг">

<script>
// Логотип можно крутить: тянуть пальцем или мышью, после отпускания вращение затухает
(function(){
var AC,bus,rev,snd=1;
function au(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();bus=AC.createGain();bus.gain.value=.9;var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=9500;var cp=AC.createDynamicsCompressor();cp.threshold.value=-18;cp.ratio.value=5;bus.connect(lp);lp.connect(cp);cp.connect(AC.destination);rev=AC.createConvolver();var L=AC.sampleRate*3.6,b=AC.createBuffer(2,L,AC.sampleRate);for(var c=0;c<2;c++){var d=b.getChannelData(c),p=0;for(var i=0;i<L;i++){p=p*.62+(Math.random()*2-1)*.38;d[i]=p*Math.pow(1-i/L,2.2)}}rev.buffer=b;var rg=AC.createGain();rg.gain.value=.5;rev.connect(rg);rg.connect(cp)}if(AC.state==='suspended')AC.resume()}catch(e){}}
function bell(f,t,d,v,o){o=o||{};if(!AC||!snd)return;try{var n=AC.currentTime+t,c=AC.createOscillator(),m=AC.createOscillator(),mm=AC.createGain(),g=AC.createGain();c.frequency.value=f;m.frequency.value=f*(o.r||2.005);mm.gain.setValueAtTime(f*(o.i||1.3),n);mm.gain.exponentialRampToValueAtTime(.01,n+d*.5);m.connect(mm);mm.connect(c.frequency);g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.006);g.gain.exponentialRampToValueAtTime(.0001,n+d);c.connect(g);g.connect(bus);g.connect(rev);c.start(n);m.start(n);c.stop(n+d+.05);m.stop(n+d+.05)}catch(e){}}
var sfx={tk:function(){if(!AC||AC.state!=='running')return;bell([1568,1760,2093,2349,2637][Math.random()*5|0],0,.06,.03,{r:3,i:.3})}};
// Звук только при вращении. Аудио готовим сразу при загрузке, а на первое касание просто «будим»,
// поэтому первый щелчок идёт без задержки.
au();
['pointerdown','touchstart','touchend','pointerup','click'].forEach(function(n){addEventListener(n,au,{passive:true})});
  var it=document.getElementById('it'),ob=document.getElementById('ob');
  var ox=0,oy=0,vx=0,vy=0,dr=0,px=0,py=0,st=0,t0=Date.now();
  it.addEventListener('pointerdown',function(e){dr=1;px=e.clientX;py=e.clientY;try{it.setPointerCapture(e.pointerId)}catch(x){}});
  it.addEventListener('pointermove',function(e){
    if(!dr)return;
    var dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;
    vy=dx*.55;vx=-dy*.35;oy+=vy;ox=Math.max(-60,Math.min(60,ox+vx));
  });
  function up(){dr=0}
  it.addEventListener('pointerup',up);it.addEventListener('pointercancel',up);
  (function tk(){
    var t=(Date.now()-t0)/1000,k=1;
    var q=Math.floor(oy/28);if(q!==st){st=q;sfx.tk()}
    if(!dr){oy+=vy;vy*=.95;ox+=vx;vx*=.9;ox*=.93;oy-=(oy-Math.round(oy/360)*360)*.045}
    ob.style.transform='rotateX('+(Math.cos(t*.6)*7*k+ox).toFixed(2)+'deg) rotateY('+(Math.sin(t*.8)*15*k+oy).toFixed(2)+'deg)';
    requestAnimationFrame(tk);
  })();
})();
