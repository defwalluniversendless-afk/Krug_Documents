*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;overflow:hidden}
.intro{position:fixed;inset:0;background:#000;overflow:hidden;touch-action:none;cursor:grab;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none}
.intro:active{cursor:grabbing}
.fog{position:absolute;inset:0;background:radial-gradient(55% 38% at 50% 46%,rgba(255,255,255,.09),transparent 70%),radial-gradient(120% 90% at 50% 50%,transparent 55%,#000 100%);opacity:0;animation:fadei 3s .3s forwards}
@keyframes fadei{to{opacity:1}}
.stage{position:relative;width:min(58vw,250px);aspect-ratio:1;perspective:850px}
.glow{position:absolute;inset:-45%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 58%);opacity:0;animation:glw 5s 2.4s ease-in-out infinite alternate;pointer-events:none}
@keyframes glw{0%{opacity:.25}100%{opacity:.8}}
.obj{position:relative;width:100%;height:100%;transform-style:preserve-3d;will-change:transform}
.ly{position:absolute;inset:0;background:var(--logo) center/contain no-repeat;filter:brightness(var(--b,1));transform:translateZ(var(--z));opacity:0;animation:asm 1.9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*14ms + .3s);pointer-events:none}
@keyframes asm{0%{opacity:0;transform:translateZ(calc(var(--z)*5)) rotateZ(calc(var(--i)*-.5deg + 8deg)) scale(1.04)}45%{opacity:1}100%{opacity:1;transform:translateZ(var(--z))}}
.ly.hl{filter:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%) 160% 0/260% 100% no-repeat;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;animation:asm 1.9s cubic-bezier(.2,.7,.2,1) both,shn 4.2s 3s ease-in-out infinite;animation-delay:.7s,3s}
@keyframes shn{0%{background-position:160% 0}55%,100%{background-position:-60% 0}}
</style>
</head>

<div class="intro" id="it" role="img" aria-label="Круг">
  <div class="fog"></div>
  <div class="stage" id="sg"><div class="glow"></div><div class="obj" id="ob"><i class="ly" style="--i:0;--z:-25.5px;--b:0.16"></i><i class="ly" style="--i:1;--z:-23.8px;--b:0.19"></i><i class="ly" style="--i:2;--z:-22.1px;--b:0.22"></i><i class="ly" style="--i:3;--z:-20.4px;--b:0.25"></i><i class="ly" style="--i:4;--z:-18.7px;--b:0.28"></i><i class="ly" style="--i:5;--z:-17.0px;--b:0.30"></i><i class="ly" style="--i:6;--z:-15.3px;--b:0.33"></i><i class="ly" style="--i:7;--z:-13.6px;--b:0.36"></i><i class="ly" style="--i:8;--z:-11.9px;--b:0.39"></i><i class="ly" style="--i:9;--z:-10.2px;--b:0.42"></i><i class="ly" style="--i:10;--z:-8.5px;--b:0.45"></i><i class="ly" style="--i:11;--z:-6.8px;--b:0.48"></i><i class="ly" style="--i:12;--z:-5.1px;--b:0.51"></i><i class="ly" style="--i:13;--z:-3.4px;--b:0.54"></i><i class="ly" style="--i:14;--z:-1.7px;--b:0.57"></i><i class="ly" style="--i:15;--z:0.0px;--b:0.59"></i><i class="ly" style="--i:16;--z:1.7px;--b:0.62"></i><i class="ly" style="--i:17;--z:3.4px;--b:0.65"></i><i class="ly" style="--i:18;--z:5.1px;--b:0.68"></i><i class="ly" style="--i:19;--z:6.8px;--b:0.71"></i><i class="ly" style="--i:20;--z:8.5px;--b:0.74"></i><i class="ly" style="--i:21;--z:10.2px;--b:0.77"></i><i class="ly" style="--i:22;--z:11.9px;--b:0.80"></i><i class="ly" style="--i:23;--z:13.6px;--b:0.83"></i><i class="ly" style="--i:24;--z:15.3px;--b:0.86"></i><i class="ly" style="--i:25;--z:17.0px;--b:0.88"></i><i class="ly" style="--i:26;--z:18.7px;--b:0.91"></i><i class="ly" style="--i:27;--z:20.4px;--b:0.94"></i><i class="ly" style="--i:28;--z:22.1px;--b:0.97"></i><i class="ly" style="--i:29;--z:23.8px;--b:1.00"></i><i class="ly hl" style="--i:30;--z:26.10px"></i></div></div>

<script>
// Логотип можно крутить: тянуть пальцем или мышью, после отпускания вращение затухает
(function(){
  var it=document.getElementById('it'),ob=document.getElementById('ob');
  var ox=0,oy=0,vx=0,vy=0,dr=0,px=0,py=0,t0=Date.now();
  it.addEventListener('pointerdown',function(e){dr=1;px=e.clientX;py=e.clientY;try{it.setPointerCapture(e.pointerId)}catch(x){}});
  it.addEventListener('pointermove',function(e){
    if(!dr)return;
    var dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;
    vy=dx*.55;vx=-dy*.35;oy+=vy;ox=Math.max(-60,Math.min(60,ox+vx));
  });
  function up(){dr=0}
  it.addEventListener('pointerup',up);it.addEventListener('pointercancel',up);
  (function tk(){
    var t=(Date.now()-t0)/1000,k=Math.min(1,Math.max(0,(t-1.5)/2));
    if(!dr){oy+=vy;vy*=.95;ox+=vx;vx*=.9;ox*=.93;oy-=(oy-Math.round(oy/360)*360)*.045}
    ob.style.transform='rotateX('+(Math.cos(t*.6)*7*k+ox).toFixed(2)+'deg) rotateY('+(Math.sin(t*.8)*15*k+oy).toFixed(2)+'deg)';
    requestAnimationFrame(tk);
  })();
})();
</script>
